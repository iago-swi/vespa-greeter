<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f4e9"><title>Ciao, Vespa! · Vespa Greeter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23274036'/%3E%3Ctext x='8' y='49' font-family='Georgia' font-style='italic' font-size='49' fill='%23f8ecce'%3EV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="scoot" viewBox="0 0 54 36"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="27" r="6"/><circle cx="42" cy="27" r="6"/><path d="M3 24c1-7 6-12 14-12h5l-3 11h9c3 0 5-3 4-6L29 6l6-1 6 18M7 22h14m-7-13h10m6-5-4-1m12 20c3-3 7-3 11 0"/><path d="M32 5l4-1 1 3-4 1"/></g></symbol>
<symbol id="sound" viewBox="0 0 24 24"><path d="m11 5-5 4H3v6h3l5 4zM15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></symbol>
<symbol id="mute" viewBox="0 0 24 24"><path d="m11 5-5 4H3v6h3l5 4zM16 9l6 6m0-6-6 6"/></symbol>
<symbol id="expand" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
<symbol id="help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.2a2.7 2.7 0 1 1 4.3 2.2c-1.2.8-1.7 1.2-1.7 2.7m0 2v.2"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.2"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8z" fill="currentColor" stroke="none"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3.4"/></symbol>
<symbol id="flag" viewBox="0 0 24 24"><path d="M5 21V4c5-4 9 4 15 0v10c-6 4-11-4-15 0"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="hand" viewBox="0 0 24 24"><path d="M8 13 6 8c-.7-1.8 1.6-2.6 2.3-.9l2.2 4.5-2.2-7c-.5-1.5 1.7-2.2 2.3-.7l2.4 6.5-1.2-7c-.3-1.5 1.9-2 2.3-.3l1.6 7 .1-5.4c0-1.6 2.2-1.6 2.2 0l.6 9.3 1.1-1.8c1-1.6 3-.3 2.1 1.3l-2.7 5c-3.2 5.2-8.4 4.1-11.2 1.3L3.2 13c-1.1-1.4.5-3 1.8-1.9z"/></symbol>
</defs></svg>
<header><div class="brand"><svg class="brandmark"><use href="#scoot"/></svg><span>Vespa <i>Greeter</i></span></div>
<div class="tools"><button id="soundBtn" aria-pressed="false"><svg><use id="soundIcon" href="#mute"/></svg><span id="soundLabel">Sound off</span></button><span class="divider"></span><button id="helpBtn" aria-label="How to play" title="How to play"><svg><use href="#help"/></svg></button><button id="fullBtn" aria-label="Enter full screen" title="Full screen"><svg><use href="#expand"/></svg></button></div></header>
<main id="scene" data-state="intro">
<canvas id="sky" aria-hidden="true"></canvas><canvas id="world" aria-label="3D view of the Alpine riding circuit"></canvas>
<div class="wash"></div>
<section class="intro" id="intro"><div class="location"><span class="swiss" aria-label="Swiss flag"></span> Swiss Alps <b>/</b> Lago di Sole</div>
<h1>Ciao,<br><em>Vespa!</em></h1>
<p>A lakeside ride on a vintage Vespa. Watch the oncoming riders and wave back before they pass.</p>
<button class="primary" id="start"><svg><use href="#play"/></svg>Start riding</button>
<div class="best" id="introBest" hidden></div>
</section>
<section class="hud" id="hud" aria-label="Ride statistics" hidden><div><small>Score</small><strong id="score">0</strong></div><div><small>Greetings</small><strong id="count">0</strong></div><button class="round" id="pauseBtn" aria-label="Pause ride"><svg><use href="#pause"/></svg></button></section>
<div id="callout" hidden><svg><use href="#hand"/></svg><span>Ciao!</span></div>
<div id="feedback" role="status"></div>
<aside class="map" aria-label="Circuit map"><div class="map-top"><span class="led"></span><span id="routeLabel">The circuit</span></div><svg id="route" viewBox="0 0 116 72" aria-hidden="true"><path id="mapPath"/><circle id="mapDot" r="3.4"/></svg><div class="map-bottom"><span id="mapKm">0.9 km</span><span id="mapNote">Loop</span></div></aside>
<button class="salute" id="tap" hidden><svg><use href="#hand"/></svg> Salute <kbd>Space</kbd></button>
<div class="veil" id="veil" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"><button id="dismiss" class="cross" aria-label="Close"><svg><use href="#close"/></svg></button><div class="location"><span class="swiss"></span> Lago di Sole</div><h2 id="sheetTitle"></h2><div id="sheetBody"></div><button class="primary" id="sheetAction"></button><button class="textbtn" id="sheetSecond" hidden></button></section></div>
</main>
<footer><div class="keys"><span><kbd>Space</kbd> Salute</span><span><kbd>P</kbd> Pause</span></div><div class="route-caption"><svg><use href="#pin"/></svg>Lago di Sole <i></i> Swiss Alps</div></footer>
<script src="engine.js"></script><script src="landmarks.js"></script><script src="vehicles.js"></script><script src="alps.js"></script><script src="ride.js"></script>
</body></html>
